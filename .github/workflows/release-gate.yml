name: Release Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tenant-pos-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 65432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      APP_ENV: development
      NODE_OPTIONS: --max-old-space-size=4096
      SUPABASE_PG_URL_DEV: postgresql://ci:ci@127.0.0.1:65432/ci
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:65432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare test database
        run: pnpm --filter @workspace/db push-force
      - name: API tests
        run: pnpm --filter @workspace/api-server test
      - name: Admin Portal tests
        run: pnpm --filter @workspace/admin-portal test
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build
        run: pnpm run build
