name: Emergency Monitor Pages

on:
  push:
    branches: [main]
    paths:
      - "public-emergency/**"
      - ".github/workflows/emergency-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: emergency-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload emergency site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-emergency
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
