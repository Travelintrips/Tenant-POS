<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Tenant POS — Emergency Monitor</title>
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f4f6f8;color:#1f2937}
    main{max-width:1200px;margin:32px auto;padding:0 18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 4px 16px rgba(0,0,0,.04)}
    h1{font-size:24px;margin:0 0 6px}h2{font-size:17px;margin:0 0 12px}.muted{color:#6b7280}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    input{min-width:290px;padding:11px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px}button{padding:11px 16px;border:0;border-radius:8px;background:#2563eb;color:white;font-weight:600;cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}.hidden{display:none}.ok{color:#047857}.err{color:#b91c1c}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}
    th,td{padding:8px;border-bottom:1px solid #e5e7eb;text-align:left;white-space:nowrap}th{background:#f9fafb;position:sticky;top:0}
    .badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:12px;font-weight:600}
  </style>
</head>
<body>
<main>
  <div class="card">
    <h1>Tenant POS — Emergency Monitor</h1>
    <div class="muted">Read-only. Data diambil langsung dari Supabase melalui HTTPS dan tidak memakai koneksi PostgreSQL Hostinger.</div>
  </div>
  <div class="card">
    <div class="row">
      <input id="pw" type="password" autocomplete="current-password" placeholder="Emergency password" />
      <button id="go" type="button">Buka Monitoring</button>
      <span class="badge">READ ONLY</span>
    </div>
    <div id="status" class="muted" style="margin-top:10px"></div>
  </div>
  <div id="content" class="hidden">
    <div class="card"><div id="generated" class="muted"></div></div>
    <div class="card"><h2>Pembayaran terbaru</h2><div class="scroll"><table id="payments"></table></div></div>
    <div class="card"><h2>Invoice terbaru</h2><div class="scroll"><table id="invoices"></table></div></div>
    <div class="card"><h2>Booking tenant terbaru</h2><div class="scroll"><table id="bookings"></table></div></div>
  </div>
</main>
<script>
(() => {
  const api = "https://nzdweipzckfszczzqtuw.supabase.co/functions/v1/tenant-emergency";
  const pw = document.getElementById("pw");
  const go = document.getElementById("go");
  const status = document.getElementById("status");
  const content = document.getElementById("content");
  let activePassword = "";

  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (m) => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));

  const draw = (el, rows) => {
    if (!Array.isArray(rows) || rows.length === 0) {
      el.innerHTML = '<tbody><tr><td class="muted">Tidak ada data.</td></tr></tbody>';
      return;
    }
    const keys = Object.keys(rows[0]);
    el.innerHTML =
      "<thead><tr>" + keys.map(k => "<th>" + esc(k) + "</th>").join("") + "</tr></thead>" +
      "<tbody>" + rows.map(r => "<tr>" + keys.map(k => "<td>" + esc(r[k]) + "</td>").join("") + "</tr>").join("") + "</tbody>";
  };

  async function load() {
    if (!activePassword) activePassword = pw.value;
    if (!activePassword) {
      status.textContent = "Masukkan emergency password.";
      status.className = "err";
      return;
    }

    go.disabled = true;
    status.textContent = "Mengambil data langsung dari Supabase...";
    status.className = "muted";

    try {
      const response = await fetch(api, {
        method: "POST",
        headers: {"content-type":"application/json"},
        body: JSON.stringify({password: activePassword}),
      });
      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || ("HTTP " + response.status));
      }

      document.getElementById("generated").textContent =
        "Terakhir diperbarui: " + new Date(data.generatedAt).toLocaleString("id-ID");
      draw(document.getElementById("payments"), data.payments);
      draw(document.getElementById("invoices"), data.invoices);
      draw(document.getElementById("bookings"), data.bookings);
      content.classList.remove("hidden");
      status.textContent = "Terhubung ke Supabase.";
      status.className = "ok";
    } catch (err) {
      content.classList.add("hidden");
      status.textContent = err?.message || String(err);
      status.className = "err";
    } finally {
      go.disabled = false;
    }
  }

  go.addEventListener("click", () => { activePassword = pw.value; void load(); });
  pw.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { activePassword = pw.value; void load(); }
  });
  setInterval(() => {
    if (activePassword && !content.classList.contains("hidden")) void load();
  }, 30000);
})();
</script>
</body>
</html>
