openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tenants
    description: Tenant management
  - name: bookings
    description: Booking management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /tenants:
    get:
      operationId: listTenants
      tags: [tenants]
      summary: List all tenants
      responses:
        "200":
          description: List of tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tenant"
    post:
      operationId: createTenant
      tags: [tenants]
      summary: Create a tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantBody"
      responses:
        "201":
          description: Created tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tenants/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getTenant
      tags: [tenants]
      summary: Get a tenant by ID
      responses:
        "200":
          description: Tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateTenant
      tags: [tenants]
      summary: Update a tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantBody"
      responses:
        "200":
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteTenant
      tags: [tenants]
      summary: Delete a tenant
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List all bookings with tenant info
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookingWithTenant"
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingBody"
      responses:
        "201":
          description: Created booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingWithTenant"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bookings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Get a booking by ID
      responses:
        "200":
          description: Booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingWithTenant"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateBooking
      tags: [bookings]
      summary: Update a booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingBody"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingWithTenant"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    TenantStatus:
      type: string
      enum: [aktif, kosong, nonaktif]

    PaymentStatus:
      type: string
      enum: [UNPAID, PARTIAL, PAID, OVERDUE]

    BookingStatus:
      type: string
      enum: [aktif, selesai, pending, batal]

    PaymentMethod:
      type: string
      enum: [tunai, transfer, qris]

    Tenant:
      type: object
      properties:
        id:
          type: integer
        businessName:
          type: string
        ownerName:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        boothNumber:
          type: string
          nullable: true
        areaName:
          type: string
        status:
          $ref: "#/components/schemas/TenantStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, businessName, ownerName, areaName, status, createdAt, updatedAt]

    CreateTenantBody:
      type: object
      properties:
        businessName:
          type: string
        ownerName:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        boothNumber:
          type: string
          nullable: true
        areaName:
          type: string
        status:
          $ref: "#/components/schemas/TenantStatus"
      required: [businessName, ownerName, areaName]

    BookingWithTenant:
      type: object
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        tenantName:
          type: string
          nullable: true
        boothNumber:
          type: string
          nullable: true
        areaName:
          type: string
          nullable: true
        startDate:
          type: string
        endDate:
          type: string
        totalAmount:
          type: integer
        paidAmount:
          type: integer
        paymentStatus:
          $ref: "#/components/schemas/PaymentStatus"
        bookingStatus:
          $ref: "#/components/schemas/BookingStatus"
        dueDate:
          type: string
          nullable: true
        periodLabel:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - tenantId
        - startDate
        - endDate
        - totalAmount
        - paidAmount
        - paymentStatus
        - bookingStatus
        - createdAt
        - updatedAt

    CreateBookingBody:
      type: object
      properties:
        tenantId:
          type: integer
        startDate:
          type: string
        endDate:
          type: string
        totalAmount:
          type: integer
        paidAmount:
          type: integer
        paymentStatus:
          $ref: "#/components/schemas/PaymentStatus"
        bookingStatus:
          $ref: "#/components/schemas/BookingStatus"
        dueDate:
          type: string
          nullable: true
        periodLabel:
          type: string
          nullable: true
      required: [tenantId, startDate, endDate]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
